# Dependency-license policy for every supported release target. The allow list
# is intentionally permissive-only; source-available and copyleft licenses are
# rejected unless a named crate has been reviewed and receives an exception.
[graph]
all-features = true
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "deny"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  # cmln itself is source-available until each release
  # date. Keeping this crate-specific prevents another FSL dependency from
  # entering unnoticed.
  { crate = "cmln", allow = ["FSL-1.1-ALv2"] },


]

# BSL-1.0 is the permissive Boost Software License, not the restrictive
# Business Source License (BUSL-1.1). Neither is globally allowed here; crates
# offering BSL-1.0 as an alternative are satisfied through Apache-2.0 instead.

# Advisory policy. The license check above gates the supply chain on
# provenance; this section gates it on known vulnerabilities and yanked
# releases. Everything not explicitly ignored fails CI.
[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained transitive macro utilities. No known exploits; removal
  # depends on upstream parents migrating off them. Tracked in the
  # dependency-hygiene issue.
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained transitive; no fixed version exists" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained transitive; no fixed version exists" },
]
